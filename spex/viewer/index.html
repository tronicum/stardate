<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spex — point cloud explorer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e12; color: #e6e6e6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    #app { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; }
    #hud { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; pointer-events: none; user-select: none; white-space: nowrap; }
    #controls { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
    #controls label { display: flex; justify-content: space-between; gap: 10px; }
    #status { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px; font-size: 12px; max-width: 60vw; }
    #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .node-label { position: absolute; transform: translate(-50%, -100%); background: rgba(0,0,0,0.75); color: #fff; font-size: 11px; line-height: 1.5; padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; text-align: left; max-width: 320px; word-break: break-word; }
    .node-label::first-line { font-weight: 600; }
    #graph-meta { display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.55); padding: 10px 16px; border-radius: 8px; font-size: 13px; text-align: center; pointer-events: none; user-select: none; max-width: min(70vw, 560px); }
    #graph-title {
      font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      animation: titleFloat 3.2s ease-in-out infinite, titleGlow 6s ease-in-out infinite;
    }
    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes titleGlow {
      0%   { text-shadow: 0 0 6px rgba(120,170,255,0.6), 0 0 16px rgba(120,170,255,0.3); }
      33%  { text-shadow: 0 0 6px rgba(255,210,90,0.6),  0 0 16px rgba(255,210,90,0.3); }
      66%  { text-shadow: 0 0 6px rgba(255,90,140,0.6),  0 0 16px rgba(255,90,140,0.3); }
      100% { text-shadow: 0 0 6px rgba(120,170,255,0.6), 0 0 16px rgba(120,170,255,0.3); }
    }
    #graph-legend { display: flex; align-items: center; gap: 8px; font-size: 11px; opacity: 0.85; }
    #legend-bar { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(to right, rgb(40,110,255), rgb(255,220,0), rgb(255,40,40)); }
    #legend-caption { font-size: 11px; opacity: 0.7; margin-top: 4px; }
    #cycle-indicator { display: none; position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px; font-size: 12px; pointer-events: none; user-select: none; }
    #debug-panel {
      display: none; position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.7); color: #8fe38f;
      padding: 8px 12px; border-radius: 8px; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.6; white-space: pre; pointer-events: none; user-select: none; max-width: 60vw;
    }

    /* M66 — the show HUD. Created by `show/hud.ts`, styled here so all of this
       viewer's typography lives in one file. Everything is a DOM overlay and
       nothing has a background plate: a screening is not an application, and a
       rounded translucent box over the picture would read as chrome. */
    #show-hud { position: absolute; inset: 0; overflow: hidden; pointer-events: none; user-select: none; }
    #show-seed-point {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; opacity: 0;
    }
    #show-title-card {
      /* Lower third, not centre. The centre of the frame belongs to the piece
         — A1-S01 puts a single device pixel there and a title card across it
         is a title card across the only thing in the shot. */
      position: absolute; left: 0; right: 0; top: 64%; text-align: center; opacity: 0;
      /* No CSS transition: the opacity is authored per frame from show time,
         and a transition would put a second, slower clock on top of the only
         clock this piece has. */
    }
    #show-title-numeral { font-size: clamp(28px, 5vw, 64px); font-weight: 200; letter-spacing: 0.22em; opacity: 0.85; }
    #show-title-text { margin-top: 0.5em; font-size: clamp(13px, 1.5vw, 20px); letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.7; }
    #show-caption {
      position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; opacity: 0;
      font-size: clamp(12px, 1.3vw, 17px); letter-spacing: 0.18em; opacity: 0;
    }
    #show-metrics {
      position: absolute; right: 5vw; bottom: 8vh; text-align: right; opacity: 0;
      font-size: clamp(10px, 1vw, 13px); letter-spacing: 0.12em; font-weight: 300;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #show-cards { position: absolute; left: 5vw; bottom: 8vh; display: flex; flex-direction: column; gap: 8px; }
    .show-card { font-size: 12px; letter-spacing: 0.1em; opacity: 0; max-width: 34vw; }
    #show-credits { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
    #show-credits-inner {
      position: absolute; left: 0; right: 0; top: 0; text-align: center; white-space: pre-line;
      font-size: clamp(12px, 1.4vw, 18px); line-height: 2.1; letter-spacing: 0.14em;
    }
    /* M71 — the gate, the section card and the mixer. Three islands of
       `pointer-events: auto` in a HUD that is otherwise transparent to the
       mouse, because a screening should not be catching clicks meant for the
       orbit controls. */
    #show-gate {
      position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: rgba(6,8,11,0.92); pointer-events: auto; text-align: center;
    }
    #show-gate-title { font-size: clamp(22px, 3.4vw, 44px); font-weight: 200; letter-spacing: 0.2em; opacity: 0.9; }
    #show-gate-sub { font-size: clamp(11px, 1.2vw, 15px); letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.55; }
    .show-gate-button {
      margin-top: 10px; background: transparent; color: #e6e6e6; border: 1px solid rgba(230,230,230,0.45);
      border-radius: 2px; padding: 12px 30px; font-size: 14px; letter-spacing: 0.28em; text-transform: uppercase;
      cursor: pointer; font-family: inherit;
    }
    .show-gate-button:hover { border-color: rgba(230,230,230,0.9); }
    #show-gate-note { font-size: 11px; letter-spacing: 0.12em; opacity: 0.45; max-width: 46ch; line-height: 1.7; }
    #show-section {
      position: absolute; left: 5vw; top: 8vh; opacity: 0; font-size: clamp(11px, 1.2vw, 15px);
      letter-spacing: 0.24em; text-transform: uppercase; font-weight: 300;
    }
    #show-mixer {
      position: absolute; right: 12px; top: 12px; display: none; flex-direction: column; gap: 6px;
      background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; font-size: 11px;
      letter-spacing: 0.08em; pointer-events: auto; opacity: 0.12; transition: opacity 0.25s;
    }
    /* Nearly invisible until someone reaches for it. A screening is not an
       application, and a mixer sitting at half opacity over the frame is
       chrome across the picture for four minutes to be used for four seconds.
       This is the one place a CSS transition is right: it is on a control, not
       on anything the show's clock drives. */
    #show-mixer:hover { opacity: 1; }
    .show-mixer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .show-mixer-row input[type=range] { width: 90px; }

    #show-director {
      display: none; position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.72); color: #8fe38f;
      padding: 10px 14px; border-radius: 6px; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.55; white-space: pre; pointer-events: none; user-select: none; max-width: 70vw;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud"></div>
    <div id="cycle-indicator">cycling · next demo in <span id="cycle-countdown"></span>s</div>
    <div id="graph-meta">
      <div id="graph-title"></div>
      <div id="graph-legend">
        <span id="legend-min"></span>
        <div id="legend-bar"></div>
        <span id="legend-max"></span>
      </div>
      <div id="legend-caption"></div>
    </div>
    <div id="controls">
      <label>Point size <input id="pointSize" type="range" min="0.5" max="8" step="0.1" value="2" /></label>
      <label>Point budget (M) <input id="pointBudget" type="range" min="0.2" max="10" step="0.1" value="2" /></label>
      <label>Labels (hover) <input id="showLabels" type="checkbox" checked /></label>
      <label>Animate packet <input id="animatePacket" type="checkbox" checked /></label>
      <label>Line edges <input id="showEdges" type="checkbox" checked /></label>
      <label>Auto-rotate <input id="autoRotate" type="checkbox" /></label>
      <!-- Mesh render mode only (a `spex mesh-model` bundle); hidden for every
           point-cloud and graph tileset, and shown by mesh/render.ts. -->
      <label id="mesh-quality-row" style="display: none">Quality <select id="quality"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
      <label id="mesh-edge-width-row" style="display: none">Edge width (px) <input id="edgeWidth" type="range" min="0.5" max="4" step="0.05" value="1.25" /></label>
      <label id="mesh-exposure-row" style="display: none">Exposure <input id="exposure" type="range" min="0.4" max="2.5" step="0.05" value="0.7" /></label>
    </div>
    <div id="status">loading tileset…</div>
    <div id="debug-panel"></div>
    <div id="labels"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
