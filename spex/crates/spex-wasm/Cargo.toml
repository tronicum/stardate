[package]
name = "spex-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spex-core = { workspace = true }
spex-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

# spex-graph's layout RNG is always seeded deterministically
# (StdRng::seed_from_u64, never thread_rng/from_entropy — see
# layout.rs), so getrandom is never actually called at runtime here.
# It still needs a backend selected to *compile* for wasm32-unknown-unknown
# at all (rand's transitive dependency); "js" is the standard choice for a
# browser target even though this crate's own code path never exercises it.
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["console_error_panic_hook"]
