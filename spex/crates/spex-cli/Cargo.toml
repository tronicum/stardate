[package]
name = "spex-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "spex"
path = "src/main.rs"

[dependencies]
spex-core = { workspace = true }
spex-io = { workspace = true }
spex-tiler = { workspace = true }
spex-server = { workspace = true }
spex-graph = { workspace = true }
spex-ldraw = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
ansi-to-tui = "8.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Raw ICMP socket creation for `spex trace --icmp` (needs elevated
# privileges to open); already present transitively via tokio, kept at the
# same locked major so no new dependency version enters the tree.
socket2 = "0.6"

[dev-dependencies]
jsonschema = { version = "0.48", default-features = false }
tempfile = "3"
